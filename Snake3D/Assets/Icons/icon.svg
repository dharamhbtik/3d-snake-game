<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background App Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Glowing Apple in Center -->
  <g id="appleGroup">
    <!-- Apple Body -->
    <path d="M 256,190 C 230,165 185,175 175,225 C 165,275 220,335 256,355 C 292,335 347,275 337,225 C 327,175 282,165 256,190 Z" fill="url(#appleGrad)"/>
    <!-- Leaf -->
    <path d="M 265,185 C 275,155 305,150 310,150 C 310,165 295,185 270,187 Z" fill="#22C55E"/>
    <!-- Stem -->
    <path d="M 256,190 C 255,175 260,165 265,160" stroke="#78350F" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Stylized Geometric 'S' Emerald Serpent -->
  <g filter="url(#glow)">
    <!-- Upper Serpent Loop -->
    <path d="M 370,140 C 280,120 180,140 160,210 C 140,280 230,310 290,320 C 350,330 380,365 370,410 C 355,465 250,475 170,440" 
          fill="none" 
          stroke="url(#snakeGrad)" 
          stroke-width="42" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Snake Head -->
    <path d="M 170,440 L 140,430 L 130,460 L 175,455 Z" fill="#34D399"/>
    <!-- Amber Eye -->
    <circle cx="150" cy="442" r="5" fill="#FBBF24"/>
  </g>
</svg>
