<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="splashSnake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="splashApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="splashGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Backdrop -->
  <circle cx="300" cy="240" r="160" fill="#10B981" fill-opacity="0.12" filter="url(#splashGlow)"/>

  <!-- Glowing Apple -->
  <g transform="translate(0, -20)">
    <path d="M 300,195 C 275,165 230,178 218,230 C 206,282 265,348 300,368 C 335,348 394,282 382,230 C 370,178 325,165 300,195 Z" fill="url(#splashApple)"/>
    <path d="M 310,190 C 322,158 352,154 358,154 C 358,170 340,190 316,192 Z" fill="#22C55E"/>
    <path d="M 300,195 C 298,178 304,166 310,160" stroke="#78350F" stroke-width="6" stroke-linecap="round"/>

    <!-- Geometric S Serpent -->
    <path d="M 425,140 C 335,115 225,140 200,215 C 175,290 280,320 345,332 C 410,345 440,380 430,428 C 412,488 300,500 210,465" 
          fill="none" 
          stroke="url(#splashSnake)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Head -->
    <path d="M 210,465 L 175,454 L 165,488 L 215,482 Z" fill="#34D399"/>
    <circle cx="186" cy="466" r="5.5" fill="#FBBF24"/>
  </g>

  <!-- Typography -->
  <text x="300" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="4">
    SNAKE 3D
  </text>
  <text x="300" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#34D399" text-anchor="middle" letter-spacing="8">
    NEW ERA
  </text>
</svg>
